<!doctype html><!-- Social card 1200×630. Wordmark: SVG del kit riqedev-brand (R02, peso 770 sobre oscuro). Render: navegador headless a 1200×630 → public/og.png --><html><head><meta charset="utf-8"><style>

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fd3a37;margin-right:10px;vertical-align:1px}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.af{position:relative;padding:22px 40px}
.af .c{border-color:#4ade80;width:30px;height:30px}

h1 img{display:block;height:155px;width:auto}
.sub{margin-top:42px;font-size:24px;letter-spacing:.28em;color:#ffffffa8}
.foot{position:absolute;bottom:56px;font-size:15px;color:#ffffff6b}
.mono{font-family:J;font-size:15px;letter-spacing:.02em;text-transform:none}
</style></head><body>
<div class="grid"></div>
